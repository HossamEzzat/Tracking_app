name: Unit Testing

on:
  pull_request:
  push:

jobs:
  unit-tests:
    name: Unit Testing Check Action
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          cache: true
      - run: flutter pub get
      - run: flutter test
